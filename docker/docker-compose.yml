services:
  zipformer-asr-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["gunicorn", "app.main:app",
              "-k", "uvicorn.workers.UvicornWorker",
              "--bind", "0.0.0.0:${PORT}",
              "--workers", "${WORKERS}"]
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
    volumes:
      - ..:/app
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    restart: unless-stopped
    networks:
      - shared

networks:
  shared:
    external: true
    name: ${DOCKER_NETWORK_NAME:-voicebot-network}